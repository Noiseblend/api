---
kind: pipeline
type: docker
name: default

platform:
  os: linux
  arch: amd64

environment:
  DOCKER_BUILDKIT: "1"

steps:
  # build on the HOST daemon (host socket) and push to the LOCAL registry.
  # plugins/docker uses an isolated dind that can't reach localhost:5000, so we
  # use docker:cli against the mounted host socket. Repo must be TRUSTED in Drone
  # for the host-volume mount to be allowed.
  - name: build
    image: docker:cli
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker build -t localhost:5000/noiseblend-api:latest .
      - docker push localhost:5000/noiseblend-api:latest

  # roll the api service so it picks up the freshly-pushed image. --force
  # recreates the task and re-resolves the tag to the new digest.
  - name: deploy
    image: docker:cli
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker service update --image localhost:5000/noiseblend-api:latest --force noiseblend_api
    when:
      branch:
        - master
    depends_on:
      - build

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
---
